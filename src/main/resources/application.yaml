spring:
  application:
    name: stock-ledger

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stockledger}
    username: ${SPRING_DATASOURCE_USERNAME:stockledger}
    password: ${SPRING_DATASOURCE_PASSWORD:stockledger_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: StockLedgerHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-}] %logger{40} - %msg%n"

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  security:
    trust-forwarded-headers: ${APP_SECURITY_TRUST_FORWARDED_HEADERS:false}
  platform:
    credentials-key: ${PLATFORM_CREDENTIALS_KEY:}
    allow-insecure-endpoints: ${APP_PLATFORM_ALLOW_INSECURE_ENDPOINTS:false}
    outbound:
      max-response-bytes: ${APP_PLATFORM_OUTBOUND_MAX_RESPONSE_BYTES:1048576}
    sync:
      scheduled-enabled: ${APP_PLATFORM_SYNC_SCHEDULED_ENABLED:true}
      http-timeout: ${APP_PLATFORM_SYNC_HTTP_TIMEOUT:10s}

