name: StockLedger CI

on:
  push:
    branches: [ main, master, develop ]
    paths-ignore: [ '**.md', '.gitignore' ]
  pull_request:
    branches: [ main, master, develop ]
    paths-ignore: [ '**.md', '.gitignore' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Testcontainers Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The setup-gradle `arguments` input was removed; Gradle commands run as
      # regular steps so the action only configures caching and reporting.
      - name: Build & Run Testcontainers Suite
        run: ./gradlew check

      - name: Upload Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-test-report
          path: build/reports/tests/test/
          retention-days: 7

  frontend:
    name: Frontend Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  docker:
    name: Container Packaging & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [test, frontend]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # `load: true` puts the built image into the local Docker daemon so the
      # Trivy steps below can scan it (buildx would otherwise discard it).
      - name: Build Backend Image (jlink + Distroless)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: stockledger-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image (Bun + Unprivileged Nginx)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: stockledger-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy scans both packaged images for HIGH/CRITICAL CVEs. This is
      # currently report-only (`exit-code: '0'`): pre-existing findings are
      # visible in the logs without failing the build. Once the first runs
      # are reviewed, flip `exit-code` to '1' to promote it to a hard gate.
      - name: Scan Backend Image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: stockledger-backend:ci
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '0'
          hide-progress: true

      - name: Scan Frontend Image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: stockledger-frontend:ci
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '0'
          hide-progress: true
