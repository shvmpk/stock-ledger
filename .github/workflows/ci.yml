name: StockLedger CI

on:
  push:
    branches: [ main, master, develop ]
    paths-ignore: [ '**.md', '.gitignore' ]
  pull_request:
    branches: [ main, master, develop ]
    paths-ignore: [ '**.md', '.gitignore' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Testcontainers Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build & Run Testcontainers Suite
        uses: gradle/actions/setup-gradle@v4
        with:
          arguments: check --no-daemon

      - name: Upload Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-test-report
          path: build/reports/tests/test/
          retention-days: 7

  frontend:
    name: Frontend Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  docker:
    name: Optimized Container Packaging
    runs-on: ubuntu-latest
    needs: [test, frontend]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image (jlink + Distroless)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: stockledger-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Image (Bun + Unprivileged Nginx)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: stockledger-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
